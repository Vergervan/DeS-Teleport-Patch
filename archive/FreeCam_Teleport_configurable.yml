Version: 1.2

# =============================================================================
# ARCHIVED snapshot — configurable teleport combo (testing 1.9).
# Working patch: BLES00932_FreeCam_Teleport.yml (1.0, L3+R3 hardcoded).
# =============================================================================
# Demon's Souls — FreeCam (horkrux) + teleport player to debug camera
# Patch Version: 1.9
#
# Regions (standard RPCS3 patch.yml FreeCam caves):
#   BLES00932 01.00  cave 0x00220320  hook 0x001451F4   TESTED
#   BLUS30443 01.00  cave 0x0021F498  hook 0x0014422C   slid -0xE88 from EU
#   BCAS20071 01.04  cave 0x0021D570  hook 0x00142304   slid -0x2DB0 from EU
#   BLUD80018 01.01  same addresses as BLUS30443 (demo loads US FreeCam)
#   BCJS30022 01.04  no FreeCam cave in patch.yml — not included
#
# GetPadDevice bl encoding is identical in all three caves (code slide).
# SetTransform / RefreshChr use the same PC-relative bl as EU, so they are
# assumed to slide with the cave. ChrInsMan is TOC-relative (-0x788C(r2)).
# US/AS/Demo teleport is not playtested.
#
# Combo is Configurable Values → "Teleport combo" (patch manager dropdown).
# Check: lhz inner+0x12E; not r3; andi. MASK; bne if any required bit missing.
# Default MASK 0x0300 = L3+R3. FreeCam (Cross+L3 tap) is unchanged.
#
# Last safe byte: cave+0x27C. Do not patch cave+0x280 (live constructor).
# =============================================================================

