  Teleport_Configurable: &Teleport_Configurable
    "Teleport combo":
      Type: long_enum
      Value: 0x70630300
      Allowed Values:
        "L3 + R3": 0x70630300
        "L3 + Triangle": 0x70630101
        "L3 + Circle": 0x70630102
        "R3": 0x70630200
        "L1 + R1": 0x70630030
        "Triangle + Circle": 0x70630003

