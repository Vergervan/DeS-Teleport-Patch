Version: 1.2

# Copy of imported_patch.yml + BLES00932 map stream origin follows the camera
# while FreeCam is on. Do not reapply at 0x146564: by then r31 is the player
# chr (ChrInsMan+0x1BC), not game_obj, and +0x58!=0 skips that block in mode 1.
# Modes 1-3 write camera+0x40 into singleton+0xB20 via sub_211750 from the cave
# (r31 is still game_obj). Force +0x58=1 in modes 2-3 so GetPos cannot overwrite.
# BLES00932 01.00 only. Do not enable together with Enable FreeCam + Teleport.
# Does not load the next fog-gated map.

